name: Check Digital Twin freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  check-dt-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project with dev dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pip install -r requirements-methods.txt

      - name: Generate example AOI bundle
        env:
          HANSEN_MINIO_CACHE: "0"
          ALLOW_SYNTHETIC_HANSEN_FALLBACK: "0"
          EUDR_DMI_DATA_ROOT: ${{ github.workspace }}/.cache/eudr-dmi-data
          EUDR_DMI_GIT_COMMIT: ""
        run: scripts/run_example_report_clean.sh --no-publish-dt

      - name: Compare generated example bundle to published Digital Twin content
        id: compare
        env:
          EUDR_DMI_PUBLISHED_REPORT_URL: "https://single-earth.github.io/eudr-dmi-gil-digital-twin/site/bundles/runs/example/report.html"
        run: |
          set +e
          python scripts/detect_example_bundle_artifact_changes.py
          detect_status=$?
          set -e

          if [[ "$detect_status" -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Digital Twin content is fresh."
          elif [[ "$detect_status" -eq 3 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Digital Twin content drift detected; uploaded diff summary artifact for review."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Digital Twin freshness detection failed with status $detect_status." >&2
            exit "$detect_status"
          fi

      - name: Upload diff summary
        if: failure() || steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dt-diff-summary
          path: |
            out/dte_update/
            out/site_bundle/aoi_reports/runs/example/reports/aoi_report_v2/estonia_testland1.html
            out/site_bundle/aoi_reports/runs/example/reports/aoi_report_v2/estonia_testland1.json
            out/site_bundle/aoi_reports/runs/example/reports/aoi_report_v2/estonia_testland1/metrics.csv
            out/site_bundle/aoi_reports/runs/example/reports/aoi_report_v2/estonia_testland1/hansen/forest_loss_post_2020_summary.json
          if-no-files-found: ignore
