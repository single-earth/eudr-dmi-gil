name: Check Digital Twin freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  check-dt-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project with dev dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pip install -r requirements-methods.txt

      - name: Generate example AOI bundle
        env:
          HANSEN_MINIO_CACHE: "0"
          ALLOW_SYNTHETIC_HANSEN_FALLBACK: "0"
          EUDR_DMI_DATA_ROOT: ${{ github.workspace }}/.cache/eudr-dmi-data
          EUDR_DMI_GIT_COMMIT: ""
        run: scripts/run_example_report_clean.sh --no-publish-dt

      - name: Compare generated example bundle to published Digital Twin content
        env:
          EUDR_DMI_PUBLISHED_REPORT_URL: "https://single-earth.github.io/eudr-dmi-gil-digital-twin/site/bundles/runs/example/report.html"
        run: python scripts/detect_example_bundle_artifact_changes.py

      - name: Upload diff summary on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dt-diff-summary
          path: out/dte_update/
          if-no-files-found: ignore
